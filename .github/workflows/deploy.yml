name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建并上传产物。
  #
  # 必须与 deploy 拆成两个 job：actions/deploy-pages 通过 artifact 元数据
  # 接口按“当前 workflow run”查找名为 github-pages 的产物。上传与部署放在
  # 同一个 job 时，刚上传的产物可能还没对元数据接口可见，deploy 会报
  #   No artifacts named "github-pages" were found for this workflow run.
  # 拆开并用 needs: 建立依赖后，deploy 开始时产物已经可见。
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # 本项目是纯静态站点，没有构建步骤 —— 仓库根目录就是最终产物。
      # 这里先把要发布的文件收集到 ./_site，只带上站点真正需要的文件，
      # 避免把 node_modules、测试代码等一并发布出去。
      #
      # 若以后引入构建步骤，把构建输出到 ./dist，然后改成：
      #   - name: Build
      #     run: npm ci && npm run build
      #   - name: Upload artifact
      #     uses: actions/upload-pages-artifact@v5
      #     with:
      #       path: ./dist
      - name: Collect static site
        run: |
          mkdir -p _site
          cp -r index.html _site/
          cp -r assets _site/
          # ffmpeg.wasm 核心（按需下载，用于 MP3 / AAC 等压缩格式转换）
          cp -r vendor _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          [ -f .nojekyll ] && cp .nojekyll _site/ || true
          [ -f favicon.ico ] && cp favicon.ico _site/ || true
          ls -la _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
          retention-days: 1

  # 部署到 GitHub Pages —— 只依赖 build job 产出的 github-pages 产物。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
